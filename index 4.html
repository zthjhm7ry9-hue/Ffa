<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel lucasffx</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .painel-container { position: relative; z-index: 10; width: 90%; max-width: 350px; background-color: rgba(20, 20, 20, 0.95); border-radius: 12px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); padding: 15px; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .header-title { font-size: 16px; font-weight: bold; color: #fff; }
        .header-title span { color: #ff3333; }
        .header-version { font-size: 10px; color: #888; text-transform: uppercase; }

        .btn-grid { display: flex; gap: 12px; margin-bottom: 12px; }
        .icon-box { width: 40px; height: 40px; background-color: rgba(255, 51, 51, 0.1); border: 1px solid #ff3333; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #ff3333; flex-shrink: 0; }
        .option-box { flex-grow: 1; background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; }
        .option-text h3 { font-size: 12px; color: #eee; margin-bottom: 2px; }
        .option-text p { font-size: 9px; color: #777; line-height: 1.2; }

        .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; margin-left: 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff3333; }
        input:checked + .slider:before { transform: translateX(14px); }

        .precision-section { background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
        .precision-header { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; }
        .precision-header span { color: #ff3333; font-weight: bold; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; position: relative; z-index: 2; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -5px; box-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #333; border-radius: 2px; }
        
        .range-container { position: relative; }
        .range-fill { position: absolute; top: 6px; left: 0; height: 4px; background: #ff3333; border-radius: 2px; width: 0%; pointer-events: none; z-index: 1; }

        .btn-main { width: 100%; background-color: #ff3333; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3); }
        .btn-main:active { background-color: #cc0000; transform: scale(0.98); }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="painel-container">
        <div class="header">
            <div class="header-title">lucas<span>ffx</span></div>
            <div class="header-version">V2.4 PREMIUM</div>
        </div>

        <!-- Opções com IDs para salvar o estado -->
        <div class="btn-grid">
            <div class="icon-box">🚀</div>
            <div class="option-box">
                <div class="option-text"><h3>Boost de Performance</h3><p>Libera recursos do sistema...</p></div>
                <label class="switch"><input type="checkbox" id="opt1"><span class="slider"></span></label>
            </div>
        </div>

        <div class="btn-grid">
            <div class="icon-box">🧹</div>
            <div class="option-box">
                <div class="option-text"><h3>Limpeza de Cache</h3><p>Remove dados temporários...</p></div>
                <label class="switch"><input type="checkbox" id="opt2"><span class="slider"></span></label>
            </div>
        </div>

        <div class="btn-grid">
            <div class="icon-box">📉</div>
            <div class="option-box">
                <div class="option-text"><h3>Redução do Recuo</h3><p>Diminui o recuo das armas...</p></div>
                <label class="switch"><input type="checkbox" id="opt3"><span class="slider"></span></label>
            </div>
        </div>

        <div class="btn-grid" style="margin-bottom: 15px;">
            <div class="icon-box">🎯</div>
            <div class="option-box">
                <div class="option-text"><h3>Aumentar Precisão</h3><p>Melhora a mira do jogador...</p></div>
                <label class="switch"><input type="checkbox" id="opt4"><span class="slider"></span></label>
            </div>
        </div>

        <div class="precision-section">
            <div class="precision-header"><span>PRECISÃO</span><span id="valor-precisao">1</span></div>
            <div class="range-container">
                <div class="range-fill" id="range-fill"></div>
                <input type="range" min="1" max="20" value="1" id="slider-precisao">
            </div>
        </div>

        <button class="btn-main" onclick="abrirFreeFire()">⚡ Abrir Free Fire</button>
    </div>

    <script>
        // --- 1. FUNÇÃO PARA ABRIR O FREE FIRE (Android e iOS) ---
        function abrirFreeFire() {
            // Tenta abrir o app via esquema de URL padrão
            window.location.href = "freefire://";
            
            // Fallback para Android (caso a URL customizada falhe)
            if (/android/i.test(navigator.userAgent)) {
                setTimeout(function() {
                    window.location.href = "intent://#Intent;package=com.dts.freefireth;end";
                }, 500);
            }
        }

        // --- 2. SCRIPT DO FUNDO DE PARTÍCULAS ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const numberOfParticles = 100; 

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5; 
                this.speedX = Math.random() * 0.5 - 0.25; 
                this.speedY = Math.random() * 0.5 + 0.1;  
                this.opacity = Math.random() * 0.5 + 0.3; 
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.y > canvas.height) { this.y = 0; this.x = Math.random() * canvas.width; }
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            requestAnimationFrame(animate);
        }
        init(); animate();
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; init(); });

        // --- 3. SCRIPT DO SLIDER ---
        const slider = document.getElementById('slider-precisao');
        const valorDisplay = document.getElementById('valor-precisao');
        const rangeFill = document.getElementById('range-fill');

        function updateSlider() {
            const val = slider.value;
            const min = slider.min ? slider.min : 0;
            const max = slider.max ? slider.max : 100;
            const percentage = ((val - min) / (max - min)) * 100;
            valorDisplay.textContent = val;
            rangeFill.style.width = percentage + '%';
            localStorage.setItem('precisao_valor', val); // Salva a precisão no celular
        }
        slider.addEventListener('input', updateSlider);
        
        // Carrega a precisão salva ao abrir
        if(localStorage.getItem('precisao_valor')) {
            slider.value = localStorage.getItem('precisao_valor');
        }
        updateSlider();

        // --- 4. SISTEMA PARA SALVAR OS BOTÕES LIGADOS/DESLIGADOS ---
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((cb) => {
            // Carrega o estado salvo
            const savedState = localStorage.getItem(cb.id);
            if(savedState === 'true') {
                cb.checked = true;
            }
            // Salva quando clicar
            cb.addEventListener('change', () => {
                localStorage.setItem(cb.id, cb.checked);
                // Aqui você pode adicionar a lógica visual (ex: mudar a cor do ícone)
            });
        });
    </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker registrado com sucesso!"))
        .catch((error) => console.error("Erro ao registrar Service Worker:", error));
    }
  </script>
</body>
</html>
